[project]
name = "praxis-workspace"
version = "0.1.0"
description = "Praxis modular monolith workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "services/api",
    "packages/core",
    "packages/cli",
    "packages/agent-runtime",
    "packages/scheduler",
    "packages/integrations",
]

[tool.uv.sources]
praxis-core = { workspace = true }
praxis-agent-runtime = { workspace = true }
praxis-scheduler = { workspace = true }
praxis-integrations = { workspace = true }
praxis-cli = { workspace = true }
praxis-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "services/api/tests",
    "packages/core/tests",
    "packages/cli/tests",
]

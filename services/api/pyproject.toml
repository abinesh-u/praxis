[project]
name = "praxis-api"
version = "0.1.0"
description = "Praxis API service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

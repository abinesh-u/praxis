[project]
name = "praxis-api"
version = "0.1.0"
description = "Praxis API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "praxis-core",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

services:
  postgres:
    image: postgres:16-alpine
    container_name: praxis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: praxis_postgres_data

[project]
name = "praxis-agent-runtime"
version = "0.1.0"
description = "Bounded tool-calling runtime and checkpoints for Praxis"
requires-python = ">=3.11"
dependencies = [
    "praxis-core",
    "pydantic>=2.8,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

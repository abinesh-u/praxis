[project]
name = "praxis-agent-runtime"
version = "0.1.0"
description = "Bounded tool-calling runtime and checkpoints for Praxis"
requires-python = ">=3.11"
dependencies = [
    "praxis-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_agent_runtime"]

[project]
name = "praxis-cli"
version = "0.1.0"
description = "Local-first command-line interface for Praxis"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "praxis-core",
]

[project.scripts]
praxis = "praxis_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "praxis-cli"
version = "0.1.0"
description = "Local-first command-line interface for Praxis"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1.0", "httpx>=0.27,<1.0"]

[project.scripts]
praxis = "praxis_cli.main:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

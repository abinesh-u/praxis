[project]
name = "praxis-core"
version = "0.1.0"
description = "Core domain entities, policies, and use cases for Praxis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_core"]

[project]
name = "praxis-integrations"
version = "0.1.0"
description = "Permission-scoped external adapters for Praxis"
requires-python = ">=3.11"
dependencies = [
    "praxis-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_integrations"]
